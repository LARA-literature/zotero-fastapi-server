# nginx.conf

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name localhost;

        return 301 https://$host$request_uri;
    }

    # HTTPS server configuration
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/localhost-cert.pem;
        ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

        # Serve the React frontend
        # location /zotero/ {
        #     root /usr/share/nginx/html;
        #     try_files $uri /index.html;
        # }

        # Proxy API requests to the FastAPI application
        location / {
            #proxy_pass http://zotero-api:8001;  # zotero-api is the name of the FastAPI service
            proxy_pass http://localhost:8009;  # zotero-api is the name of the FastAPI service
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
